#
# Fallback for stock / xPack OpenOCD (no gd32e23x flash driver).
# GD32E230G6U6TR: Cortex-M23 TAP 0x0BF11477, 32 KB flash, 1 KB pages.
# Do not stm32f1x mass_erase: a wrong size wipes past the real flash.
#

adapter driver cmsis-dap
transport select swd

set CHIPNAME gd32e230
set CPUTAPID 0x0bf11477
set FLASH_SIZE 0x8000
set WORKAREASIZE 0x1000

source [find target/stm32f1x.cfg]

adapter speed 1000
reset_config none
